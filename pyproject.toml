[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbit-secrets-gcp"
version = "0.1.0a1"
description = "Google Cloud Secret Manager adapter for Orbit Secrets."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "orbit-secrets>=0.1.0a1,<0.2",
  "google-cloud-secret-manager>=2.24,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.13,<3", "pip-audit>=2.9,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_secrets_gcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbit_secrets_gcp"]

[[tool.mypy.overrides]]
module = ["google.cloud.*", "google.api_core.*"]
ignore_missing_imports = true
